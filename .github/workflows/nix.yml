name: Nix

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  nix-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        # Fetch what an earlier run already pushed instead of building it again.
        extra_nix_config: |
          extra-substituters = https://nix.rhea.minhuw.dev/ops
          extra-trusted-public-keys = ops:ls8dtVi8ul674I7oY8yMlEFdt7BWX6fufpWchv+WdmI=

    - name: Build package
      run: nix build

    - name: Check flake
      run: nix flake check

    # Rhea's worker nodes install the exporter from the public ops cache instead of building it.
    - name: Push to the Nix cache
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
      run: |
        attic="nix shell github:nixos/nixpkgs/nixos-25.05#attic-client -c attic"
        $attic login rhea https://nix.rhea.minhuw.dev/ "$ATTIC_TOKEN"
        $attic push rhea:ops $(nix path-info .#default)
